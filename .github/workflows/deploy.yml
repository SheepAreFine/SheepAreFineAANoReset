name: Build and publish the site

# Builds this site from the latest code in zesskyo/aa-stats and the runs in this repository.
# It runs whenever something here changes, once a day (so new features show up on their own),
# and from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository != 'zesskyo/aa-stats-template'   # the template itself isn't a website
    runs-on: ubuntu-latest
    steps:
      - name: Get this site's runs
        uses: actions/checkout@v4
        with:
          path: site
      - name: Get the site code
        uses: actions/checkout@v4
        with:
          repository: zesskyo/aa-stats
          ref: main   # put a tag or commit here to keep this site on that version of the code
          path: code
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node code/build.mjs site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
